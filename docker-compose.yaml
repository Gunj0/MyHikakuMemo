services:
  my-hikaku-memo:
    build: .
    restart: always
    container_name: my-hikaku-memo
    ports:
      - 8080:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=MyHikakuMemo;Username=user;Password=password
    depends_on:
      - db
  db:
    image: postgres:17
    restart: always
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: MyHikakuMemo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
volumes:
  db-store:
